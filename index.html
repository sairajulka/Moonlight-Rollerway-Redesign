<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonlight Rollerway Skating Rink</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
    
        <div class="top-nav">
            <div class="logo">
                LOGO
            </div>
            <div class="buttons">
                <button>Get Tickets</button>
                <button>Contact Us</button>
                <button>FAQ</button>
            </div>
        </div>
          
       <nav>
            <ul>
                <li><a href="#">Book a Party</a></li>
                <li><a href="#">Schools & Groups</a></li>
                <li><a href="#">Lessons</a></li>
                <li><a href="#">Schedule & Events</a></li>
                <li><a href="#">Our Policies</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-image">
            <img src="images/hero.jpg" alt="">
        </div>
        
        <aside class ="events">
            <h2>Upcoming Events</h2>
        </aside>
    </section>
  
    <section class="section">
        <div class="circles">
            <div class="yellow"></div>
            <div class="blue"></div>
            <div class="pink"></div>

            <div class="photo-frame">
                <img src="images/skating.jpg" alt="">
            </div>
        </div>

        <div class="intro-text">
            <h3>Lace up your skates!</h3>
            <div class="small-image">
                <img src="images/skating.jpg" alt="">
            </div>
        </div>
    </section>

    <section class="info reverse">
        <div class="text">
            <h3>Celebrate!</h3>
            <h1>WE THROW 
                AWESOME 
                BIRTHDAY 
                PARTIES</h1>
            <button>Learn More</button>
        </div>
        <div class="image">
            <img src="images/birthday.jpg" alt="">
        </div>
    </section>

    <section class="info">
        <div class="image">
            <img src="images/lessons.jpg" alt="">
        </div>
        <div class="text">
            <h3>Learn!</h3>
            <h1>SKATE 
                LESSONS 
                FOR EVERY 
                AGE</h1>
            <button>Learn More</button>
        </div>
    </section>

    <section class="info reverse">
        <div class="text">
            <h3>Host!</h3>
            <h1>HOST YOUR 
                NEXT CORPORATE, 
                SCHOOL OR 
                STEM EVENT</h1>
            <button>Learn More</button>
        </div>
        <div class="image">
            <img src="images/catering.jpg" alt="">
        </div>
    </section>
    </body>
    </html>
