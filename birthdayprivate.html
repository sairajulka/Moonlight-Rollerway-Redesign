<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Parties - Private</title>
    <link rel="stylesheet" href="style.css">
    <link href= "https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="hero-wrapper">

    <header class="site header">
        <div class="top-bar">
            <div class="logo">
                LOGO
            </div>
            <nav class="main-nav">
                <a href="#" class="btn">Get Tickets</a>
                <a href="#" class="btn">Contact Us</a>
                <a href="#" class="btn">FAQ</a>
            </nav>
        </div>
       
        <div class="sub-bar">
            <ul class="sub-nav">
                <li><a href="#">Book a Party</a></li>
                <li><a href="#">Schools & Groups</a></li>
                <li><a href="#">Lessons</a></li>
                <li><a href="#">Schedule & Events</a></li>
                <li><a href="#">Our Policies</a></li>
            </ul>
        </div>
    </header>

    <section class="hero-grid">
        <div class="hero-box-left"></div>
        <div class="hero-box-right"></div>
    </section>
</div>

<section class="lessons-container">
    <div class="lessons-grid">
        
        <div class="lesson-card">
            <h4>Cost</h4>
            <div class="lesson-box"></div>
        </div>

        <div class="lesson-card">
            <h4>Times</h4>
            <div class="lesson-box"></div>
        </div>

        <div class="lesson-card">
            <h4>How to book</h4>
        <div class="lesson-box"></div>
    </div>
</section>

<section class="content-container">
    <div class="grid-row">
        <div class="text-side">
            <span  class="sub-title">Whats included?</span>
            <h2>WE GOT 
                YOU 
                COVERED
            </h2>
            <a href="#" class="btn">Learn More</a>
        </div>
        <div class="media-side">
            <div class="image-placeholder landscape-box"></div>
        </div>
    </div>
</section>
    
<section class="addons-container">
   <h3 class="addons-title">SPECIAL FEATURES & ADD ON's</h3>

    <div class="addons-grid">
        <div class="addon-item">
            <h4>Skating instructor</h4>
            <div class="addon-box"></div>
        </div>


        <div class="addon-item">
            <h4>Music</h4>
            <div class="addon-box"></div>
        </div>

        <div class="addon-item">
            <h4>Snack bar</h4>
            <div class="addon-box"></div>
        </div>
    </div>

    <div class="ring-group-left">
        <div class="yellow-ring-1"></div>
        <div class="yellow-ring-2"></div>
        <div class="cyan-ring-top-outer"></div>
        <div class="cyan-ring-top"></div>
        <div class="magenta-ring"></div>
    </div>


    <div class="ring-group-right">
        <div class="yellow-ring-right-1"></div>
        <div class="yellow-ring-right-2"></div>
        <div class="cyan-ring-bottom"></div>
        <div class="cyan-ring-bottom-outer"></div>
    </div>  
</section>

</body>
</html>
